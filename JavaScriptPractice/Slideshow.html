
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>JavaScript Practice 1 - Slideshow</title>

    <style type="text/css">

        .flashclass {
            height: 200px;
            width: 250px;
            border: 5px solid orange;
            padding: 5px;
            text-align: center;
        }

        .flashclass img {
            border-width: 0;
        }

    </style>

    <script type="text/javascript" src="transitionshow.js"></script>
</head>

<body>

    <h1>JavaScript Image Slideshow</h1>

    <p>Watch the images automatically change.</p>

    <script type="text/javascript">

        // Create the slideshow
        var flashyshow = new flashyslideshow({

            wrapperid: "myslideshow",

            wrapperclass: "flashclass",

            // Four thumbnail images and their captions
            imagearray: [

                [
                    "Images/Thumbnails/CoupleSailingSm.jpg",
                    "",
                    "",
                    "Newlyweds Sailing"
                ],

                [
                    "Images/Thumbnails/PigSm.jpg",
                    "",
                    "",
                    "Boy and His Pig"
                ],

                [
                    "Images/Thumbnails/SaladSm.jpg",
                    "",
                    "",
                    "Yummy Salad"
                ],

                [
                    "Images/Thumbnails/StorkSm.jpg",
                    "",
                    "",
                    "Stork at Sunset"
                ]

            ],

            // Time between slides
            pause: 2000,

            // Transition duration
            transduration: 1000

        });

    </script>

</body>
</html>
