<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Survey | Extreme Honeymoons</title>
    <link rel="stylesheet" href="mystyles.css">
    <script src="myscripts.js" defer></script>
</head>
<body>

<div id="container">
    <header>
        <div class="branding">
            <a href="Home.html"
               onmouseover="swapMe('logo','logo2.jpg')"
               onmouseout="swapMe('logo','logo1.jpg')"
               onfocus="swapMe('logo','logo2.jpg')"
               onblur="swapMe('logo','logo1.jpg')">
                <img id="logo" src="Images/logo1.jpg"
                     alt="Extreme Honeymoons logo">
            </a>

            <img class="banner" src="Images/banner.jpg"
                 alt="Extreme Honeymoons adventure banner">
        </div>

        <nav aria-label="Main navigation">
            <a href="Home.html">Home</a>
            <a href="AboutUs.html">About Us</a>
            <a href="Tributes.html">Tributes</a>
            <a href="Survey.html">Survey</a>
            <a href="Favorites.html">Favorites</a>
        </nav>
    </header>

    <section>
        <article>
            <h1>Honeymoon Survey</h1>

            <p>
                What kind of adventure would you enjoy
                on your honeymoon?
            </p>

            <form>
                <label for="adventure">
                    Choose an adventure:
                </label>

                <select id="adventure" name="adventure">
                    <option>Mountain biking</option>
                    <option>Scuba diving</option>
                    <option>Snowboarding</option>
                    <option>Mountain hiking</option>
                </select>

                <p>
                    <button type="button"
                        onclick="alert('Thanks for sharing your preference!')">
                        Submit preference
                    </button>
                </p>
            </form>
        </article>
    </section>

    <footer>
        <a href="mailto:webmaster@example.com">
            Email the Webmaster
        </a>
        |
        This web site has been created solely for
        educational purposes.
    </footer>
</div>

</body>
</html>
